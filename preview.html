<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MT panel mockup</title>
<style>
body { background:#1b1b1b; color:#ccc; font:14px Consolas,monospace; padding:24px }
.panel { display:table; padding:10px; margin:20px 0; border:1px solid #696969; background:#303030; white-space:pre; font:10pt Consolas,monospace }
.title { font-size:11pt; color:white } .open {color:lime} .closed {color:tomato} .notice {color:tomato;font-size:11pt} .row { min-height:22px }
button {padding:8px; margin-right:8px} small {display:block;max-width:720px;line-height:1.5}
</style></head><body>
<h1>MT panel mockup</h1><small>Illustrative values only; actual sizing and broker data are provided by MT5. PT and %L are estimates, not trade probabilities. Phase 3 plans and diary are informational; Phase 4 rows below are illustrative, not actual broker orders.</small>
<p><button data-mode="open">Open</button><button data-mode="closed">Closed</button><button data-mode="unknown">No table</button><button data-mode="unsupported">Unsupported timeframe</button></p>
<div class="panel"><div class="row"><span class="title">MT V1.00</span><span id="prefix"></span><span id="state"></span><span id="suffix"></span></div><div class="row" id="detail"></div><div class="row" id="header-reserved"></div><div class="row lane" id="m5"></div><div class="row lane" id="m15"></div><div class="row lane" id="m30"></div><div class="row extra" id="plan-m5"></div><div class="row extra" id="plan-m15"></div><div class="row extra" id="plan-m30"></div><div class="row extra" id="quotes"></div><div class="row extra" id="auto-m5"></div><div class="row extra" id="auto-m15"></div><div class="row extra" id="auto-m30"></div><div class="row extra" id="diary-m5"></div><div class="row extra" id="diary-m15"></div><div class="row extra" id="diary-m30"></div></div>
<script>
const samples = {
 open:{prefix:' | XAUUSDm | Metal | ', state:'OPEN', suffix:' | 2026.11.02 11:57:34', detail:''},
 closed:{prefix:' | XAUUSDm | Metal | ', state:'close', suffix:' | Open at 2026.11.03 00:00:00', detail:'MARKET CLOSED - next open Tue 2026.11.03 00:00:00 server (in 12h 2m)'},
 unknown:{prefix:' | BTCUSDm | Crypto | ', state:'MARKET STATUS UNKNOWN', suffix:'', detail:'no session table; Open at --; no quote available'},
 unsupported:{prefix:' | XAUUSDm | H1', state:'', suffix:'', detail:'Incompatible chart. Switch to M5/M15/M30.'}
};
const lanes = {m5:'M5 | GT: UP | CT: DOWN | ST: CONFLICT | RG: CHOPPY | PT: -- | SC: -1/3 (--%L)',m15:'M15 | GT: UP | CT: UP | ST: UP | RG: STEADY | PT: ~3b | SC: +2/3 (50%L)',m30:'M30 | GT: DOWN | CT: DOWN | ST: DOWN | RG: MIXED | PT: 0b+ | SC: -3/3 (past est.)'};
const extra = {'plan-m5':'M5 | Signal: NONE','plan-m15':'M15 | Signal: BUY | LIMIT Entry: 2600.00 | Lot: 0.05 | SL: 2599.00 (-50.00 USD) | TP: 2601.50 (+75.00 USD)','plan-m30':'M30 | Signal: SELL | MARKET Entry: 2600.00 | Lot: 0.05 | SL: 2601.00 (-50.00 USD) | TP: 2598.50 (+75.00 USD)',quotes:'Bid: 2600.00 | Ask: 2600.10','auto-m5':'M5 | Auto: no active order','auto-m15':'M15 | BUY LIMIT | Entry 2600.00 (distance 0.10) | Lot 0.05 | SL 2599.00 (-50.00 USD) | TP 2601.50 (+75.00 USD)','auto-m30':'M30 | SELL OPEN | Entry 2600.00 | Lot 0.05 | SL 2601.00 (-50.00 USD) | TP 2598.50 (+75.00 USD)','diary-m5':'M5 | Today S 3 W 1 L 1 | All S 80 W 42 L 25','diary-m15':'M15 | Today S 2 W 0 L 1 | All S 55 W 30 L 17','diary-m30':'M30 | Today S 1 W 1 L 0 | All S 36 W 20 L 11'};
function render(mode) {const s=samples[mode];for(const k of ['prefix','state','suffix','detail']) document.getElementById(k).textContent=s[k];for(const k of Object.keys(lanes))document.getElementById(k).textContent=lanes[k];for(const k of Object.keys(extra))document.getElementById(k).textContent=extra[k];if(mode!=='open'){document.getElementById('plan-m15').textContent='M15 | Signal: BUY | Entry: -- | Plan data unavailable';document.getElementById('plan-m30').textContent='M30 | Signal: SELL | Entry: -- | Plan data unavailable';}const detail=document.getElementById('detail');detail.hidden=false;document.getElementById('header-reserved').hidden=mode==='unsupported';document.getElementById('state').className=mode==='open'?'open':'closed';detail.className=mode==='unsupported'?'row notice':'row';document.querySelectorAll('.lane, .extra').forEach(e=>e.hidden=mode==='unsupported');}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.mode)));render('open');
</script></body></html>
